<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
"use strict";

// ===== CONFIG: every tunable number lives here =====
const CONFIG = {
  width: 640, height: 360,      // logical resolution, letterboxed to fit the window
  step: 1 / 60,                 // fixed update step (seconds)
  maxFrame: 0.25,               // clamp long frames (tab switch, breakpoint) to avoid a spiral of death
  seed: Date.now() >>> 0,       // set a number to replay the same run
  colors: { bg: "#1b1b2f", player: "#f4d35e", enemy: "#ee6c4d", pickup: "#4361ee", text: "#f5f5f5", dim: "#8d8daa" },
  player: { size: 14, speed: 180 },
  enemy: { size: 14, speedMin: 50, speedMax: 110, spawnEvery: 1.6, spawnRamp: 0.97, spawnMin: 0.35 },
  pickup: { size: 10, score: 1, minDistance: 120 },
};

// ===== Seeded RNG (mulberry32): use game.rng, never Math.random, so runs can be replayed =====
function makeRng(seed) {
  let a = seed >>> 0;
  const next = () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    next,
    range: (min, max) => min + (max - min) * next(),
    int: (min, max) => Math.floor(min + (max - min + 1) * next()),
    pick: (list) => list[Math.floor(next() * list.length)],
  };
}

// ===== Canvas and letterboxed view =====
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const view = { scale: 1, x: 0, y: 0, dpr: 1 };

function resize() {
  view.dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(innerWidth * view.dpr);
  canvas.height = Math.round(innerHeight * view.dpr);
  view.scale = Math.min(innerWidth / CONFIG.width, innerHeight / CONFIG.height);
  view.x = (innerWidth - CONFIG.width * view.scale) / 2;
  view.y = (innerHeight - CONFIG.height * view.scale) / 2;
}
addEventListener("resize", resize);
resize();

// ===== Input: keys map to actions; game code reads actions only =====
const KEYMAP = {
  ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down",
  ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right",
  Space: "action", Enter: "action", KeyP: "pause", Escape: "pause",
  KeyR: "restart", Backquote: "debug",
};
const input = {
  down: new Set(),      // held this step
  pressed: new Set(),   // went down since the last update step
  pointer: { x: 0, y: 0, down: false },
};

addEventListener("keydown", (e) => {
  const action = KEYMAP[e.code];
  if (!action) return;
  e.preventDefault();
  if (!e.repeat) input.pressed.add(action);
  input.down.add(action);
});
addEventListener("keyup", (e) => {
  const action = KEYMAP[e.code];
  if (action) input.down.delete(action);
});

function pointerToWorld(e) {
  input.pointer.x = (e.clientX - view.x) / view.scale;
  input.pointer.y = (e.clientY - view.y) / view.scale;
}
canvas.addEventListener("pointerdown", (e) => { pointerToWorld(e); input.pointer.down = true; input.pressed.add("action"); });
canvas.addEventListener("pointermove", pointerToWorld);
addEventListener("pointerup", () => { input.pointer.down = false; });

function releaseAll() {
  input.down.clear();
  input.pointer.down = false;
  if (game.scene === "play") game.paused = true;
}
addEventListener("blur", releaseAll);
document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAll(); });

// ===== Game state =====
const game = {
  scene: "title",   // title | play | over
  paused: false,
  debug: false,
  seed: CONFIG.seed,
  rng: makeRng(CONFIG.seed),
  time: 0,
  score: 0,
  best: loadBest(),
  player: null,
  enemies: [],
  pickups: [],
  spawnTimer: 0,
  spawnEvery: 0,
  fps: 0,
};
window.__game = { game, CONFIG }; // read-only hook for playtest automation

function loadBest() {
  try { return Number(localStorage.getItem("best")) || 0; } catch { return 0; }
}
function saveBest() {
  try { localStorage.setItem("best", String(game.best)); } catch { /* storage unavailable */ }
}

function entity(x, y, size, extra) {
  return { x, y, px: x, py: y, size, ...extra };
}

function startRun() {
  game.seed = game.rng.int(0, 0xffffffff);
  game.rng = makeRng(game.seed);
  game.scene = "play";
  game.paused = false;
  game.time = 0;
  game.score = 0;
  game.player = entity(CONFIG.width / 2, CONFIG.height / 2, CONFIG.player.size);
  game.enemies = [];
  game.pickups = [];
  game.spawnEvery = CONFIG.enemy.spawnEvery;
  game.spawnTimer = game.spawnEvery;
  spawnPickup();
}

function endRun() {
  game.scene = "over";
  if (game.score > game.best) { game.best = game.score; saveBest(); }
}

// ===== Demo gameplay: replace with the brief's core loop =====
function spawnEnemy() {
  const { rng } = game;
  const side = rng.int(0, 3);
  const x = side === 0 ? 0 : side === 1 ? CONFIG.width : rng.range(0, CONFIG.width);
  const y = side === 2 ? 0 : side === 3 ? CONFIG.height : rng.range(0, CONFIG.height);
  game.enemies.push(entity(x, y, CONFIG.enemy.size, { speed: rng.range(CONFIG.enemy.speedMin, CONFIG.enemy.speedMax) }));
}

function spawnPickup() {
  const { rng, player } = game;
  const margin = CONFIG.pickup.size * 2;
  let x, y, tries = 0;
  do {
    x = rng.range(margin, CONFIG.width - margin);
    y = rng.range(margin, CONFIG.height - margin);
  } while (Math.hypot(x - player.x, y - player.y) < CONFIG.pickup.minDistance && ++tries < 20);
  game.pickups.push(entity(x, y, CONFIG.pickup.size));
}

function overlaps(a, b) {
  const reach = (a.size + b.size) / 2;
  return Math.abs(a.x - b.x) < reach && Math.abs(a.y - b.y) < reach;
}

function clamp(v, min, max) { return v < min ? min : v > max ? max : v; }

function updatePlay(dt) {
  const p = game.player;
  p.px = p.x; p.py = p.y;

  let dx = (input.down.has("right") ? 1 : 0) - (input.down.has("left") ? 1 : 0);
  let dy = (input.down.has("down") ? 1 : 0) - (input.down.has("up") ? 1 : 0);
  if (input.pointer.down) {
    dx = input.pointer.x - p.x;
    dy = input.pointer.y - p.y;
    if (Math.hypot(dx, dy) < 2) dx = dy = 0;
  }
  const len = Math.hypot(dx, dy);
  if (len > 0) {
    p.x += (dx / len) * CONFIG.player.speed * dt;
    p.y += (dy / len) * CONFIG.player.speed * dt;
  }
  const half = p.size / 2;
  p.x = clamp(p.x, half, CONFIG.width - half);
  p.y = clamp(p.y, half, CONFIG.height - half);

  game.spawnTimer -= dt;
  if (game.spawnTimer <= 0) {
    spawnEnemy();
    game.spawnEvery = Math.max(CONFIG.enemy.spawnMin, game.spawnEvery * CONFIG.enemy.spawnRamp);
    game.spawnTimer += game.spawnEvery;
  }

  for (const e of game.enemies) {
    e.px = e.x; e.py = e.y;
    const ex = p.x - e.x, ey = p.y - e.y;
    const d = Math.hypot(ex, ey) || 1;
    e.x += (ex / d) * e.speed * dt;
    e.y += (ey / d) * e.speed * dt;
    if (overlaps(p, e)) { endRun(); return; }
  }

  for (let i = game.pickups.length - 1; i >= 0; i--) {
    if (overlaps(p, game.pickups[i])) {
      game.pickups.splice(i, 1);
      game.score += CONFIG.pickup.score;
      spawnPickup();
    }
  }
  game.time += dt;
}

// ===== Fixed-step update =====
function update(dt) {
  if (input.pressed.has("debug")) game.debug = !game.debug;
  if (game.scene === "title" || game.scene === "over") {
    if (input.pressed.has("action") || input.pressed.has("restart")) startRun();
    return;
  }
  if (input.pressed.has("restart")) { startRun(); return; }
  if (input.pressed.has("pause")) game.paused = !game.paused;
  if (!game.paused) updatePlay(dt);
}

// ===== Render (alpha interpolates between the last two update steps) =====
function lerp(a, b, t) { return a + (b - a) * t; }

function drawEntity(e, color, alpha) {
  const x = lerp(e.px, e.x, alpha), y = lerp(e.py, e.y, alpha);
  ctx.fillStyle = color;
  ctx.fillRect(x - e.size / 2, y - e.size / 2, e.size, e.size);
}

function text(str, x, y, size, color, align = "center") {
  ctx.font = `${size}px monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}

function render(alpha) {
  const C = CONFIG.colors, W = CONFIG.width, H = CONFIG.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const s = view.scale * view.dpr;
  ctx.setTransform(s, 0, 0, s, view.x * view.dpr, view.y * view.dpr);
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, W, H);

  if (game.scene === "title") {
    text("PROTOTYPE", W / 2, H / 2 - 30, 32, C.text);
    text("move: WASD / arrows / drag   start: space / click", W / 2, H / 2 + 20, 12, C.dim);
    return;
  }

  const a = game.paused || game.scene !== "play" ? 1 : alpha;
  for (const p of game.pickups) drawEntity(p, C.pickup, a);
  for (const e of game.enemies) drawEntity(e, C.enemy, a);
  drawEntity(game.player, C.player, a);

  text(`score ${game.score}`, 12, 16, 14, C.text, "left");
  text(`best ${game.best}`, W - 12, 16, 14, C.dim, "right");
  if (game.debug) text(`fps ${game.fps.toFixed(0)}  enemies ${game.enemies.length}  seed ${game.seed}`, 12, H - 14, 10, C.dim, "left");

  if (game.paused) {
    text("PAUSED", W / 2, H / 2, 28, C.text);
    text("P / Esc to resume", W / 2, H / 2 + 30, 12, C.dim);
  } else if (game.scene === "over") {
    text("GAME OVER", W / 2, H / 2 - 20, 28, C.text);
    text(`score ${game.score}   best ${game.best}`, W / 2, H / 2 + 14, 14, C.text);
    text("space / click / R to restart", W / 2, H / 2 + 40, 12, C.dim);
  }
}

// ===== Main loop =====
let last = performance.now();
let acc = 0;
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > CONFIG.maxFrame) dt = CONFIG.maxFrame;
  if (dt > 0) game.fps = lerp(game.fps, 1 / dt, 0.1);
  acc += dt;
  while (acc >= CONFIG.step) {
    update(CONFIG.step);
    input.pressed.clear();
    acc -= CONFIG.step;
  }
  render(acc / CONFIG.step);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
