name: validate

on:
  push:
  pull_request:

env:
  LUAU_VERSION: "0.747"
  ROJO_VERSION: "7.7.1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # Dependencies are declared in inline script headers and in this workflow's --with flags.
          cache-dependency-glob: |
            tools/skills.py
            mcp/roblox-forge/server.py
            mcp/creative-director/server.py
            .github/workflows/validate.yml
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Luau and Rojo
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/luau.zip "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/luau-ubuntu.zip"
          curl -fsSL -o /tmp/rojo.zip "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip"
          unzip -o /tmp/luau.zip -d "$HOME/.local/bin"
          unzip -o /tmp/rojo.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/"*
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Test the validator and skill scripts
        run: uv run --with pyyaml python -m unittest discover -s tools -v
      - name: Test skill JavaScript libraries
        run: node --test tools/test_game_assets.test.mjs
      - name: Type-check pure Luau modules
        run: >
          luau-analyze --mode=strict
          skills/roblox-scripting/assets/rojo-template/src/server/RemoteGuard.luau
          skills/roblox-scripting/assets/rojo-template/src/server/PlayerData.luau
          skills/roblox-scripting/assets/rojo-template/src/shared/Config.luau
          skills/roblox-scripting/assets/rojo-template/src/shared/Juice.luau
          skills/roblox-gameplay/assets/RoundSystem.luau
      - name: Test Luau modules
        run: luau tools/luau/test_roblox_modules.luau
      - name: Smoke-test the roblox-forge MCP server over stdio
        run: uv run --python 3.12 --with mcp==2.3.0 python tools/mcp_smoke.py
      - name: Validate skills
        run: tools/skills.py validate --strict
