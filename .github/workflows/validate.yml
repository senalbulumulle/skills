name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # Dependencies are declared in inline script headers and in this workflow's --with flags.
          cache-dependency-glob: |
            tools/skills.py
            mcp/web-dev/motion-forge/server.py
            .github/workflows/validate.yml
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test the validator and skill scripts
        run: uv run --with pyyaml python -m unittest discover -s tools -v
      - name: Test skill and motion-forge JavaScript
        run: node --test tools/test_game_assets.test.mjs tools/test_motion_components.test.mjs
      - name: Smoke-test the MCP servers over stdio
        run: uv run --python 3.12 --with mcp==2.3.0 python tools/mcp_smoke.py
      - name: Validate skills
        run: tools/skills.py validate --strict
